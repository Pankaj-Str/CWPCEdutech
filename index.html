<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

        name="description"

    <style>

        /* =====================================================
           GLOBAL
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            color: #ffffff;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(88, 101, 242, 0.25),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 20%,
                    rgba(0, 212, 255, 0.20),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 50% 100%,
                    rgba(168, 85, 247, 0.20),
                    transparent 35%
                ),
                #07070b;

            overflow-x: hidden;
        }


        /* =====================================================
           BACKGROUND GLOW ORBS
        ===================================================== */

        .orb {
            position: fixed;

            width: 350px;
            height: 350px;

            border-radius: 50%;

            filter: blur(100px);

            opacity: 0.25;

            pointer-events: none;

            z-index: -1;

            animation: float 12s ease-in-out infinite;
        }

        .orb-one {
            top: -150px;
            left: -100px;

            background: #6366f1;
        }

        .orb-two {
            top: 35%;
            right: -150px;

            background: #06b6d4;

            animation-delay: -4s;
        }

        .orb-three {
            bottom: -180px;
            left: 35%;

            background: #a855f7;

            animation-delay: -8s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(30px, -30px);
            }
        }


        /* =====================================================
           PAGE
        ===================================================== */

        .page {
            width: 100%;

            max-width: 1500px;

            margin: auto;

            padding: 30px;
        }


        /* =====================================================
           GLASS HEADER
        ===================================================== */

        .header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            margin-bottom: 30px;

            padding: 20px 25px;

            background:
                rgba(255, 255, 255, 0.07);

            border:
                1px solid rgba(255, 255, 255, 0.13);

            border-radius: 20px;

            backdrop-filter: blur(20px);

            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }


        /* =====================================================
           BRAND
        ===================================================== */

        .brand {
            display: flex;

            align-items: center;

            gap: 14px;
        }

        .brand-logo {
            width: 48px;
            height: 48px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 14px;

            font-size: 20px;
            font-weight: 800;

            background:
                linear-gradient(
                    135deg,
                    rgba(99, 102, 241, 0.9),
                    rgba(6, 182, 212, 0.8)
                );

            box-shadow:
                0 10px 30px rgba(99, 102, 241, 0.25);
        }

        .brand-text h1 {
            font-size: 20px;

            font-weight: 750;

            letter-spacing: -0.5px;
        }

        .brand-text p {
            margin-top: 3px;

            color: rgba(255, 255, 255, 0.55);

            font-size: 12px;
        }


        /* =====================================================
           YOUTUBE BUTTON
        ===================================================== */

        .youtube-btn {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 8px;

            padding: 11px 17px;

            border-radius: 12px;

            color: #ffffff;

            text-decoration: none;

            font-size: 13px;

            font-weight: 650;

            background:
                rgba(255, 255, 255, 0.08);

            border:
                1px solid rgba(255, 255, 255, 0.13);

            backdrop-filter: blur(10px);

            transition:
                transform 0.25s ease,
                background 0.25s ease;
        }

        .youtube-btn:hover {
            transform: translateY(-2px);

            background:
                rgba(255, 255, 255, 0.14);
        }


        /* =====================================================
           VIDEO GRID
        ===================================================== */

        .video-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 25px;
        }


        /* =====================================================
           GLASS VIDEO CARD
        ===================================================== */

        .video-card {

            position: relative;

            padding: 10px;

            border-radius: 22px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.12),
                    rgba(255, 255, 255, 0.035)
                );

            border:
                1px solid rgba(255, 255, 255, 0.14);

            backdrop-filter: blur(25px);

            -webkit-backdrop-filter: blur(25px);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);

            overflow: hidden;

            transition:
                transform 0.35s ease,
                border-color 0.35s ease,
                box-shadow 0.35s ease;
        }


        /* Glass shine */

        .video-card::before {

            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.35),
                    transparent
                );

            pointer-events: none;

            z-index: 2;
        }


        /* Hover */

        .video-card:hover {

            transform:
                translateY(-7px);

            border-color:
                rgba(255, 255, 255, 0.25);

            box-shadow:
                0 35px 90px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }


        /* =====================================================
           VIDEO
        ===================================================== */

        .video-wrapper {

            position: relative;

            width: 100%;

            aspect-ratio: 16 / 9;

            overflow: hidden;

            border-radius: 15px;

            background: #000;
        }

        .video-wrapper iframe {

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            border: 0;

            display: block;
        }


        /* =====================================================
           BOTTOM INFO
        ===================================================== */

        .video-info {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            padding: 15px 8px 6px;
        }

        .video-number {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 34px;
            height: 28px;

            padding: 0 10px;

            border-radius: 9px;

            font-size: 11px;

            font-weight: 700;

            color: rgba(255,255,255,0.75);

            background:
                rgba(255,255,255,0.07);

            border:
                1px solid rgba(255,255,255,0.09);
        }

        .video-status {

            display: flex;

            align-items: center;

            gap: 7px;

            color:
                rgba(255,255,255,0.48);

            font-size: 11px;
        }

        .live-dot {

            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #22c55e;

            box-shadow:
                0 0 12px rgba(34,197,94,0.8);
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 900px) {

            .page {
                padding: 20px;
            }

            .video-grid {
                grid-template-columns: 1fr;
            }
        }


        @media (max-width: 600px) {

            .page {
                padding: 12px;
            }

            .header {

                padding: 15px;

                border-radius: 16px;
            }

            .brand-logo {

                width: 42px;
                height: 42px;

                border-radius: 12px;
            }

            .brand-text h1 {
                font-size: 17px;
            }

            .brand-text p {
                font-size: 10px;
            }

            .youtube-btn {

                padding: 9px 11px;

                font-size: 11px;
            }

            .video-grid {
                gap: 16px;
            }

            .video-card {
                padding: 7px;

                border-radius: 17px;
            }

            .video-wrapper {
                border-radius: 11px;
            }

            .video-info {
                padding-top: 11px;
            }
        }


        /* =====================================================
           VERY SMALL MOBILE
        ===================================================== */

        @media (max-width: 400px) {

            .brand-text p {
                display: none;
            }

            .youtube-btn {
                font-size: 0;
            }

            .youtube-btn::before {
                content: "YouTube";

                font-size: 11px;
            }
        }

    </style>
</head>
