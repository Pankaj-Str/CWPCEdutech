<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Responsive Design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Codes With Pankaj - Videos</title>

    <style>
        /* ==============================
           RESET
        ============================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* ==============================
           BODY
        ============================== */

        body {
            min-height: 100vh;
            background: #0b0b0f;
            font-family: Arial, Helvetica, sans-serif;
            padding: 30px;
        }


        /* ==============================
           VIDEO CONTAINER
        ============================== */

        .video-container {
            width: 100%;
            max-width: 1500px;
            margin: 0 auto;
        }


        /* ==============================
           VIDEO GRID
        ============================== */

        .video-grid {
            display: grid;

            /* 2 videos per row */
            grid-template-columns: repeat(2, 1fr);

            gap: 25px;
        }


        /* ==============================
           VIDEO CARD
        ============================== */

        .video-card {
            position: relative;

            width: 100%;

            /* Perfect YouTube 16:9 ratio */
            aspect-ratio: 16 / 9;

            background: #15151c;

            border-radius: 14px;

            overflow: hidden;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.35);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }


        /* ==============================
           HOVER EFFECT
        ============================== */

        .video-card:hover {
            transform: translateY(-4px);

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.5);
        }


        /* ==============================
           IFRAME
        ============================== */

        .video-card iframe {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            border: none;

            display: block;
        }


        /* ==============================
           TABLET
        ============================== */

        @media (max-width: 900px) {

            body {
                padding: 20px;
            }

            .video-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .video-grid {
                gap: 15px;
            }

            .video-card {
                border-radius: 10px;
            }

        }
    </style>
</head>
